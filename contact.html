<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — Thomas LeClair Photography</title>

  <meta name="description" content="Contact Thomas LeClair Photography for commissioned work or metal print inquiries. Share your preferred reply method (text/email/phone) and project details." />
  <link rel="canonical" href="https://www.tleclair.com/contact.html" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="Contact — Thomas LeClair Photography" />
  <meta property="og:description" content="Commissioned photography + metal print inquiries. Send a message and include your preferred reply method." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.tleclair.com/contact.html" />
  <meta property="og:image" content="https://www.tleclair.com/images/home-auto.webp" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Contact — Thomas LeClair Photography" />
  <meta name="twitter:description" content="Commissioned photography + metal print inquiries. Send a message and include your preferred reply method." />
  <meta name="twitter:image" content="https://www.tleclair.com/images/home-auto.webp" />

  <style>
    * { box-sizing: border-box; }

    :root{
      --bg:#0e0e0e;
      --text:#f5f5f5;
      --muted:rgba(245,245,245,.72);
      --muted2:rgba(245,245,245,.58);
    }

    body{
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;

      /* keeps footer behaving nicely even on short pages */
      display: flex;
      flex-direction: column;
    }

    main { flex: 1 0 auto; }

    /* ================= NAV STYLES (works whether nav is inline OR injected) ================= */
    nav#siteNav{
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(14,14,14,.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition: transform 1.25s ease, opacity 1.55s ease;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;

      border-bottom: 1px solid transparent;
      border-image: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.10),
        rgba(255,255,255,0)
      ) 1;
    }

    /* auto-hide behavior (desktop only, JS adds body.autohide) */
    body.autohide nav#siteNav{
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
    }
    body.autohide nav#siteNav.is-visible,
    body.autohide nav#siteNav:hover,
    body.autohide nav#siteNav:focus-within{
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* force visible on touch devices */
    @media (max-width: 768px) {
      body.autohide nav#siteNav{
        transform: translateY(0) !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }
    }

    /* space under fixed nav */
    main{
      padding-top: 10.5rem; /* keep your original contact spacing */
      max-width: 700px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
      padding-bottom: 3rem;
    }
    @media (max-width: 640px){
      main{ padding-top: 11.25rem; }
    }

    h1{
      font-weight: 300;
      letter-spacing: 0.06em;
      text-align: center;
      margin-bottom: 1rem;
    }

    p.intro{
      text-align: center;
      opacity: 0.75;
      margin-bottom: 3rem;
      line-height: 1.6;
    }

    form{
      display: grid;
      gap: 1.5rem;
      margin-top: 0;
    }

    label{
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 0.25rem;
      display: block;
    }

    input, select, textarea{
      width: 100%;
      padding: 0.75rem;
      background: #151515;
      border: 1px solid rgba(255,255,255,0.2);
      color: #f5f5f5;
      font-family: inherit;
      font-size: 0.9rem;
      border-radius: 10px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus{
      border-color: rgba(245,245,245,0.45);
    }

    textarea{
      resize: vertical;
      min-height: 140px;
    }

    button{
      margin-top: 0.25rem;
      padding: 0.95rem;
      background: #f5f5f5;
      color: #0e0e0e;
      border: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 10px;
    }
    button:hover{ opacity: 0.9; }

    /* ================= INCLUDED FOOTER (GLOBAL) ================= */
    /* footer.html should contain: <footer class="site-footer"> ... </footer> */
    .site-footer{
      border-top: 1px solid transparent;
      border-image: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.10),
        rgba(255,255,255,0)
      ) 1;

      padding: 2rem 1rem;
      font-size: 0.8rem;
      color: #b8b8b8;
      text-align: center;
    }

    .site-footer a{
      color: #b8b8b8;
      text-decoration: none;
      margin: 0 0.5rem;
    }
    .site-footer a:hover{ color:#e0e0e0; }
  </style>
</head>

<body>
  <!-- NAV: this version *works* because it loads your existing perfected Nav.html -->
  <div id="site-nav"></div>

  <main>
    <h1>Contact</h1>
    <p class="intro">
      For print inquiries or commissioned work, please use the form below.
      All prints are produced individually on metal.
    </p>

    <!-- Formspree form (JS intercept guarantees redirect without paid plan) -->
    <form id="contactForm" action="https://formspree.io/f/xpqwgnzz" method="POST">
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>
      </div>

      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div>
        <label for="size">Print Size (if applicable)</label>
        <select id="size" name="size">
          <option value="">— Select —</option>
          <option>48" Wide</option>
          <option>36" Wide</option>
          <option>Small (note details)</option>
          <option>Custom size</option>
          <option>Commission / Photoshoot</option>
        </select>
      </div>

      <div>
        <label for="message">Message me - Let me know the best way to reply to you.</label>
        <div style="font-size:0.85rem; opacity:0.65; margin-top:-0.5rem; margin-bottom:0.25rem;">
        </div>
        <textarea id="message" name="message" placeholder="How can I help? Preferred reply method (text/email/phone) + your best contact info." required></textarea>
      </div>

      <input type="hidden" name="_subject" value="New inquiry from tleclair.com">
      <input type="hidden" name="_replyto" id="replytoHidden">
      <input type="hidden" name="_next" value="https://www.tleclair.com/thank-you.html">
      <input type="text" name="_gotcha" style="display:none">

      <button type="submit">SEND INQUIRY</button>
    </form>
  </main>

  <!-- GLOBAL FOOTER INCLUDE -->
  <div id="site-footer"></div>

  <script>
    async function includeHTML(id, url) {
      const el = document.getElementById(id);
      if (!el) return false;

      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) {
          el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
            Missing include: <strong>${url}</strong> (HTTP ${res.status})
          </div>`;
          return false;
        }
        el.innerHTML = await res.text();
        return true;
      } catch (err) {
        el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
          Failed to load include: <strong>${url}</strong>
        </div>`;
        return false;
      }
    }

    function initNavAutoHide() {
      const nav = document.getElementById("siteNav");
      if (!nav) return;

      const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (!canHover) return; // don’t hide on touch devices

      document.body.classList.add("autohide");

      let hideTimer = null;
      const HIDE_DELAY = 900;

      const showNav = () => {
        nav.classList.add("is-visible");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, HIDE_DELAY);
      };

      const hideSoon = () => {
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, HIDE_DELAY);
      };

      // Start hidden (it will reveal when mouse hits top band)
      nav.classList.remove("is-visible");

      document.addEventListener("mousemove", (e) => {
        if (e.clientY < 90) showNav();
      });

      nav.addEventListener("mouseenter", showNav);
      nav.addEventListener("mouseleave", hideSoon);
      nav.addEventListener("focusin", showNav);
      nav.addEventListener("focusout", hideSoon);
    }

    (async () => {
      // Load your perfected nav markup
      const navOK  = await includeHTML("site-nav", "/includes/Nav.html");
      // Load footer (this already works well)
      const footOK = await includeHTML("site-footer", "/includes/footer.html");

      // Init nav behavior only AFTER nav is present in DOM
      if (navOK) initNavAutoHide();

      if (!footOK) console.warn("footer include failed. Check exact path/case: /includes/footer.html");
    })();
  </script>

  <!-- Formspree submit + redirect -->
  <script>
    (function () {
      const form = document.getElementById('contactForm');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Ensure Formspree gets a proper Reply-To value
        const emailField = form.querySelector('#email');
        const replytoHidden = form.querySelector('#replytoHidden');
        if (emailField && replytoHidden) {
          replytoHidden.value = emailField.value.trim();
        }

        const formData = new FormData(form);

        try {
          const res = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
          });

          if (res.ok) {
            window.location.href = 'https://www.tleclair.com/thank-you.html';
          } else {
            alert('Sorry — something went wrong sending your message. Please try again.');
          }
        } catch (err) {
          alert('Network error — please try again.');
        }
      });
    })();
  </script>
</body>
</html>
