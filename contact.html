<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GYPE7JD4H9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GYPE7JD4H9');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — Thomas LeClair Photography</title>

  <meta name="description" content="Contact Thomas LeClair Photography for commissioned work or metal print inquiries. Share your preferred reply method (text/email/phone) and project details." />
  <link rel="canonical" href="https://www.tleclair.com/contact.html" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="Contact — Thomas LeClair Photography" />
  <meta property="og:description" content="Commissioned photography + metal print inquiries. Send a message and include your preferred reply method." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.tleclair.com/contact.html" />
  <meta property="og:image" content="https://www.tleclair.com/images/home-auto.webp" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Contact — Thomas LeClair Photography" />
  <meta name="twitter:description" content="Commissioned photography + metal print inquiries. Send a message and include your preferred reply method." />
  <meta name="twitter:image" content="https://www.tleclair.com/images/home-auto.webp" />

  <style>
    * { box-sizing: border-box; }

    :root{
      --bg:#0e0e0e;
      --text:#f5f5f5;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* NOTE:
      Nav + Footer now come from /includes/Nav.html and /includes/Footer.html
      So we REMOVE nav/footer styling from this page.
    */

    main {
      padding-top: 10.5rem; /* keeps spacing under fixed global nav */
      max-width: 700px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
      padding-bottom: 3rem;
    }

    @media (max-width: 640px){
      main { padding-top: 11.25rem; }
    }

    h1 {
      font-weight: 300;
      letter-spacing: 0.06em;
      text-align: center;
      margin-bottom: 1rem;
    }

    p.intro {
      text-align: center;
      opacity: 0.75;
      margin-bottom: 3rem;
      line-height: 1.6;
    }

    form {
      display: grid;
      gap: 1.5rem;
      margin-top: 0;
    }

    label {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 0.25rem;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      background: #151515;
      border: 1px solid rgba(255,255,255,0.2);
      color: #f5f5f5;
      font-family: inherit;
      font-size: 0.9rem;
      border-radius: 10px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus{
      border-color: rgba(245,245,245,0.45);
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    button {
      margin-top: 0.25rem;
      padding: 0.95rem;
      background: #f5f5f5;
      color: #0e0e0e;
      border: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 10px;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>

<body>
  <!-- GLOBAL NAV INCLUDE -->
  <div id="site-nav"></div>

  <main>
    <h1>Contact</h1>
    <p class="intro">
      For print inquiries or commissioned work, please use the form below.
      All prints are produced individually on metal.
    </p>

    <!-- Formspree form (JS intercept guarantees redirect without paid plan) -->
    <form id="contactForm" action="https://formspree.io/f/xpqwgnzz" method="POST">
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>
      </div>

      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div>
        <label for="size">Print Size (if applicable)</label>
        <select id="size" name="size">
          <option value="">— Select —</option>
          <option>48" Wide</option>
          <option>36" Wide</option>
          <option>Small (note details)</option>
          <option>Custom size</option>
          <option>Commission / Photoshoot</option>
        </select>
      </div>

      <div>
        <label for="message">Message me</label>
        <div style="font-size:0.85rem; opacity:0.65; margin-top:-0.5rem; margin-bottom:0.25rem;">
          Let me know the best way to reply to you.
        </div>
        <textarea id="message" name="message" placeholder="How can I help? Preferred reply method (text/email/phone) + your best contact info." required></textarea>
      </div>

      <input type="hidden" name="_subject" value="New inquiry from tleclair.com">
      <input type="hidden" name="_replyto" id="replytoHidden">
      <input type="hidden" name="_next" value="https://www.tleclair.com/thank-you.html">
      <input type="text" name="_gotcha" style="display:none">

      <button type="submit">SEND INQUIRY</button>
    </form>
  </main>

  <!-- GLOBAL FOOTER INCLUDE -->
  <div id="site-footer"></div>

  <script>
    async function includeHTML(id, url) {
      const el = document.getElementById(id);
      if (!el) return;

      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) {
        el.innerHTML = "Missing include: " + url + " (HTTP " + res.status + ")";
        return;
      }
      el.innerHTML = await res.text();
    }

    includeHTML("site-nav", "/includes/Nav.html");
    includeHTML("site-footer", "/includes/Footer.html");
  </script>

  <script>
    (function () {
      const form = document.getElementById('contactForm');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Ensure Formspree gets a proper Reply-To value
        const emailField = form.querySelector('#email');
        const replytoHidden = form.querySelector('#replytoHidden');
        if (emailField && replytoHidden) {
          replytoHidden.value = emailField.value.trim();
        }

        const formData = new FormData(form);

        try {
          const res = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
          });

          if (res.ok) {
            window.location.href = 'https://www.tleclair.com/thank-you.html';
          } else {
            alert('Sorry — something went wrong sending your message. Please try again.');
          }
        } catch (err) {
          alert('Network error — please try again.');
        }
      });
    })();
  </script>
</body>
</html>
