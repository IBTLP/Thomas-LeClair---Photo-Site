  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      color: #f5f5f5;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 14, 14, 0.85);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .brand img {
      height: 50px;
      width: auto;
      display: block;
      opacity: 0.95;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      text-decoration: none;
      color: #f5f5f5;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    nav a:hover {
      opacity: 1;
    }

    main {
      padding-top: 9.5rem;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    h1 {
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 3.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    /* === MATCH AUTOMOTIVE / LANDSCAPE === */
    .gallery-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      transition: opacity 0.2s ease;
      cursor: zoom-in;
    }

    .gallery-grid img:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      font-size: 0.8rem;
      color: #b8b8b8;
    }

    footer a {
      color: #b8b8b8;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      color: #e0e0e0;
    }

    /* === GLOBAL LIGHTBOX (shared) === */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(14,14,14,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
      pointer-events: none;
    }

    .lightbox[style*="display: flex"] {
      pointer-events: auto;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
    }

    /* === ADDITIONS (NO STYLE CHANGES TO EXISTING RULES) === */
    .page-head { margin-bottom: 2rem; }
    .subtitle {
      max-width: 820px;
      margin: 0.25rem auto 0;
      text-align: center;
      color: rgba(245,245,245,0.72);
      font-weight: 300;
      line-height: 1.6;
    }

    .section-title{
      margin: 2.25rem 0 1rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      font-size: 1rem;
      color: rgba(245,245,245,0.75);
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
