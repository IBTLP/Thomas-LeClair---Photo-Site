<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Automotive — Thomas LeClair Photography</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      color: #f5f5f5;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 14, 14, 0.85);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .brand img {
      height: 50px;
      width: auto;
      display: block;
      opacity: 0.95;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      text-decoration: none;
      color: #f5f5f5;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    nav a:hover {
      opacity: 1;
    }

    main {
      padding-top: 9.5rem;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    h1 {
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 3.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    .gallery-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      transition: opacity 0.2s ease;
    }

    .gallery-grid a:hover img {
      opacity: 0.9;
    }

    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      font-size: 0.8rem;
      color: #b8b8b8;
    }

    footer a {
      color: #b8b8b8;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      color: #e0e0e0;
    }

    /* ===== GLOBAL LIGHTBOX (ADDED) ===== */

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(14,14,14,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
    }
  </style>
</head>

<body>
<nav>
  <div class="brand">
    <a href="/"><img src="/images/Signature-TuesdayNight_Font+photography_250.png"></a>
  </div>
  <ul>
    <li><a href="/">Home</a></li>
    <li><a href="/gallery/">Gallery</a></li>
    <li><a href="/editorial/">Editorial</a></li>
    <li><a href="/about.html">About</a></li>
    <li><a href="/prints.html">Prints</a></li>
    <li><a href="/contact.html">Contact</a></li>
  </ul>
</nav>

<main>
<h1>Automotive</h1>

<section class="gallery-grid">
  <img src="/images/gallery/Automotive/1962-Nova-Red-65.webp">
  <img src="/images/gallery/Automotive/20180928Rennsport-Reunion-VI-IMG_0283webp.webp">
  <img src="/images/gallery/Automotive/20180930Rennsport-Reunion-VI-IMG_3718-Edit.webp">
  <img src="/images/gallery/Automotive/0190511Luftgekult-6-IMG_3806.webp">
  <img src="/images/gallery/Automotive/20190115lamborghini-champagne-IMG_7444.webp">
  <img src="/images/gallery/Automotive/PetersonMuseum-146webp.webp">
  <img src="/images/gallery/Automotive/JRWBronco-029.webp">
  <img src="/images/gallery/Automotive/ClassicCarTourUtah-716webp.webp">
</section>
</main>

<footer>
  <a href="https://www.instagram.com/tlp_motoring_photography/" target="_blank">Instagram — Motoring</a>

  <a href="https://www.instagram.com/tlp_outdoor_photography/" target="_blank">Instagram — Outdoor</a>
</footer>

<!-- GLOBAL LIGHTBOX (ADDED) -->
<div class="lightbox" id="global-lightbox" aria-hidden="true">
  <img id="global-lightbox-img" alt="">
</div>

<script src="/js/lightbox.js" defer></script>

</body>
</html>
