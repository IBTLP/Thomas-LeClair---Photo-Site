  <style>
    * { box-sizing: border-box; }

    :root{
      --bg: #0e0e0e;
      --text: rgba(245,245,245,0.96);
      --muted: rgba(245,245,245,0.84);
      --soft: rgba(245,245,245,0.66);
      --hairline: rgba(255,255,255,0.22);
      --button-bg: rgba(12, 22, 40, 0.74);
      --button-bg-hover: rgba(20, 34, 60, 0.86);
      --button-border: rgba(255,255,255,0.28);
      --button-border-hover: rgba(255,255,255,0.46);
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      font-family: Georgia, "Times New Roman", Times, serif;
    }

    /* ================= NAV STYLES (KEEP EXISTING) ================= */
    nav#siteNav{
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(14,14,14,.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition: transform 1.25s ease, opacity 1.55s ease;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;

      border-bottom: 1px solid transparent;
      border-image: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.10),
        rgba(255,255,255,0)
      ) 1;
    }

    body.autohide nav#siteNav{
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
    }

    body.autohide nav#siteNav.is-visible,
    body.autohide nav#siteNav:hover,
    body.autohide nav#siteNav:focus-within{
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 768px) {
      body.autohide nav#siteNav{
        transform: translateY(0) !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }
    }

    /* ================= HERO ================= */
    .hero {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #0e0e0e;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to bottom,
          rgba(8,10,14,0.46) 0%,
          rgba(8,10,14,0.20) 18%,
          rgba(8,10,14,0.08) 38%,
          rgba(8,10,14,0.08) 68%,
          rgba(8,10,14,0.18) 84%,
          rgba(8,10,14,0.32) 100%);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(circle at top center, rgba(255,255,255,0.05), transparent 42%),
        linear-gradient(to right,
          rgba(0,0,0,0.12),
          rgba(0,0,0,0.03) 28%,
          rgba(0,0,0,0.03) 72%,
          rgba(0,0,0,0.14)),
        linear-gradient(to bottom,
          rgba(0,0,0,0.18),
          rgba(0,0,0,0.02) 24%,
          rgba(0,0,0,0.08) 100%);
      pointer-events: none;
    }

    /* ================= MAIN ================= */
    main {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        clamp(6rem, 8vw, 7rem)
        1.25rem
        clamp(2.25rem, 4vw, 3.5rem);
      text-align: center;
    }

    .hero-inner{
      width: min(100%, 980px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-mark{
      width: min(100%, 360px);
      height: auto;
      display: block;
      margin: 0 auto 1rem;
      filter: drop-shadow(0 2px 16px rgba(0,0,0,0.22));
    }

    .top-rule{
      width: min(92vw, 1120px);
      height: 1px;
      margin: 0 auto 2rem;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,0.28),
        rgba(255,255,255,0)
      );
    }

    h1{
      margin: 0;
      max-width: 14.5ch;
      font-weight: 400;
      font-size: clamp(2.2rem, 4.2vw, 4rem);
      line-height: 1.18;
      letter-spacing: -0.01em;
      text-wrap: balance;
      text-shadow: 0 2px 18px rgba(0,0,0,0.22);
    }

    .subline{
      margin: 1rem 0 0;
      font-size: clamp(1.05rem, 1.4vw, 1.5rem);
      line-height: 1.5;
      color: var(--muted);
      text-shadow: 0 2px 14px rgba(0,0,0,0.20);
    }

    .cta-wrap{
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .cta-button{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 290px;
      padding: 0.95rem 1.6rem;
      color: rgba(255,255,255,0.96);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      box-shadow:
        0 10px 28px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.08);
      transition:
        background 220ms ease,
        border-color 220ms ease,
        transform 220ms ease,
        box-shadow 220ms ease;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    @media (hover:hover){
      .cta-button:hover{
        background: var(--button-bg-hover);
        border-color: var(--button-border-hover);
        transform: translateY(-1px);
        box-shadow:
          0 14px 30px rgba(0,0,0,0.24),
          inset 0 1px 0 rgba(255,255,255,0.10);
      }
    }

    .cta-button:focus-visible,
    .subnav a:focus-visible{
      outline: 2px solid rgba(255,255,255,0.55);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .subnav{
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem 1rem;
      margin-top: 0.15rem;
      color: var(--soft);
      font-size: 1rem;
      line-height: 1.5;
    }

    .subnav a{
      color: rgba(245,245,245,0.86);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.22);
      padding-bottom: 2px;
      transition: color 220ms ease, border-color 220ms ease;
    }

    .subnav .dot{
      opacity: 0.6;
    }

    @media (hover:hover){
      .subnav a:hover{
        color: rgba(255,255,245,0.98);
        border-bottom-color: rgba(255,255,255,0.44);
      }
    }

    .proof{
      margin-top: 1.15rem;
      font-size: 0.95rem;
      line-height: 1.4;
      color: rgba(245,245,245,0.72);
      text-shadow: 0 2px 14px rgba(0,0,0,0.20);
    }

    .proof .label{
      opacity: 0.82;
      margin-right: 0.5rem;
    }

    .proof .pub{
      display: inline-block;
      margin: 0 0.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: rgba(245,245,245,0.88);
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 980px){
      .hero img{
        object-position: 60% center;
      }
    }

    @media (max-width: 768px){
      main{
        padding-top: 6rem;
        padding-bottom: 2rem;
      }

      .brand-mark{
        width: min(88vw, 300px);
        margin-bottom: 0.85rem;
      }

      .top-rule{
        margin-bottom: 1.5rem;
      }

      h1{
        max-width: 13.5ch;
        font-size: clamp(2rem, 8vw, 3rem);
      }

      .subline{
        font-size: 1rem;
        max-width: 28ch;
      }

      .cta-button{
        min-width: min(88vw, 320px);
      }

      .subnav{
        max-width: 22rem;
        gap: 0.45rem 0.85rem;
        font-size: 0.98rem;
      }

      .proof{
        max-width: 24rem;
        font-size: 0.88rem;
      }
    }

    @media (max-width: 560px){
      .hero img{
        object-position: 64% center;
      }

      .subnav{
        flex-direction: column;
        gap: 0.45rem;
      }

      .subnav .dot{
        display: none;
      }

      .proof .pub{
        display: inline;
        margin: 0 0.22rem;
      }
    }
  </style>
</head>

  <script>
    async function includeHTML(id, url) {
      const el = document.getElementById(id);
      if (!el) return false;

      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) {
          el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
            Missing include: <strong>${url}</strong> (HTTP ${res.status})
          </div>`;
          return false;
        }
        el.innerHTML = await res.text();
        return true;
      } catch (err) {
        el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
          Failed to load include: <strong>${url}</strong>
        </div>`;
        return false;
      }
    }

    function initNavAutoHide() {
      const nav = document.getElementById("siteNav");
      if (!nav) return;

      const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (!canHover) return;

      document.body.classList.add("autohide");

      let hideTimer = null;

      const showNav = () => {
        nav.classList.add("is-visible");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      const hideSoon = () => {
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      nav.classList.remove("is-visible");

      document.addEventListener("mousemove", (e) => {
        if (e.clientY < 90) showNav();
      });

      nav.addEventListener("mouseenter", showNav);
      nav.addEventListener("mouseleave", hideSoon);
      nav.addEventListener("focusin", showNav);
      nav.addEventListener("focusout", hideSoon);
    }

    (async () => {
      const navOk = await includeHTML("site-nav", "/includes/Nav.html");
      if (navOk) initNavAutoHide();
    })();
  </script>
