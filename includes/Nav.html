<style>
  :root{
    --nav-bg: rgba(14,14,14,0.85);
    --nav-text: rgba(245,245,245,0.92);
    --nav-hair: rgba(255,255,255,0.10);
  }

  /* ================= NAV (AUTO-HIDE + HAIRLINE) ================= */
  nav.site-nav{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 1.25rem 0;
    background: var(--nav-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 1000;
    transition: transform 0.65s cubic-bezier(.22,1,.36,1), opacity 0.65s ease;

    /* gradient hairline */
    border-bottom: 1px solid transparent;
    border-image: linear-gradient(
      90deg,
      rgba(255,255,255,0),
      var(--nav-hair),
      rgba(255,255,255,0)
    ) 1;
  }

  /* Pull nav content away from edges */
  nav.site-nav .nav-inner{
    width: min(1040px, calc(100% - 84px));
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
  }

  /* Brand + logo hover brighten */
  nav.site-nav .brand img{
    height: 54px;
    width: auto;
    display: block;
    opacity: 0.90;
    transition: opacity 180ms ease, filter 180ms ease;
  }
  @media (hover:hover){
    nav.site-nav .brand-link:hover img{
      opacity: 1;
      filter: brightness(1.12) contrast(1.05);
    }
  }

  nav.site-nav .nav-links{
    list-style: none;
    display: flex;
    gap: 1.35rem;
    margin: 0;
    padding: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
  }

  nav.site-nav a{
    color: var(--nav-text);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    opacity: 0.80;
    padding: 0.35rem 0;
    position: relative;
    transition: opacity 0.2s ease;
    line-height: 1;
  }
  nav.site-nav a:hover{ opacity: 1; }

  /* Underline hover */
  nav.site-nav a::after{
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 100%;
    height: 1px;
    background: rgba(245,245,245,0.42);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 220ms ease, background 220ms ease;
  }
  @media (hover:hover){
    nav.site-nav a:hover::after{ transform: scaleX(1); }
  }

  /* Optional subtle emphasis */
  nav.site-nav a.nav-primary{
    opacity: 0.92;
  }
  nav.site-nav a.nav-primary::after{
    background: rgba(245,245,245,0.55);
    transform: scaleX(0.33);
  }
  @media (hover:hover){
    nav.site-nav a.nav-primary:hover::after{ transform: scaleX(1); }
  }

  /* ================= AUTO-HIDE (DESKTOP ONLY) =================
     Default state (when body has .autohide): hidden.
     It appears when nav is .is-visible OR hovered OR focused.
  */
  body.autohide nav.site-nav{
    transform: translateY(-115%);
    opacity: 0;
    pointer-events: none;
  }

  body.autohide nav.site-nav.is-visible,
  body.autohide nav.site-nav:hover,
  body.autohide nav.site-nav:focus-within{
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  /* ================= MOBILE / TOUCH ================= */
  @media (max-width: 768px){
    /* keep nav visible on touch devices */
    body.autohide nav.site-nav{
      transform: translateY(0) !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }
  }

  @media (max-width: 640px){
    nav.site-nav{ padding: 1.05rem 0; }

    nav.site-nav .nav-inner{
      width: calc(100% - 32px);
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    nav.site-nav .brand img{ height: 50px; }

    nav.site-nav .nav-links{
      width: 100%;
      justify-content: center;
      gap: 1.0rem;
    }

    nav.site-nav a{
      font-size: 0.95rem;
      opacity: 0.90;
    }
  }
</style>

<script>
  // Auto-hide nav on hover-capable devices only
  (function(){
    var nav = document.getElementById('siteNav');
    if (!nav) return;

    var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (!canHover) return;

    // Enable auto-hide mode (default hidden)
    document.body.classList.add('autohide');

    var hideTimer = null;

    function showNav(){
      nav.classList.add('is-visible');
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){
        if (!nav.matches(':hover') && !nav.matches(':focus-within')){
          nav.classList.remove('is-visible');
        }
      }, 3900); // a bit snappier
    }

    function scheduleHide(){
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(function(){
        if (!nav.matches(':hover') && !nav.matches(':focus-within')){
          nav.classList.remove('is-visible');
        }
      }, 3900);
    }

    // Start hidden, only show when user approaches top
    nav.classList.remove('is-visible');

    // Show when cursor is near top edge
    document.addEventListener('mousemove', function(e){
      if (e.clientY < 90) showNav();
    });

    // Keep visible while interacting
    nav.addEventListener('mouseenter', showNav);
    nav.addEventListener('mouseleave', scheduleHide);
    nav.addEventListener('focusin', showNav);
    nav.addEventListener('focusout', scheduleHide);
  })();
</script>
