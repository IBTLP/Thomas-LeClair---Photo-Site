  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #0e0e0e;
      color: #f5f5f5;
      overflow-x: hidden;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    nav#siteNav{
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(14,14,14,.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 1.25s ease, opacity 1.55s ease;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.10),
        rgba(255,255,255,0)
      ) 1;
    }

    body.autohide nav#siteNav{
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
    }

    body.autohide nav#siteNav.is-visible,
    body.autohide nav#siteNav:hover,
    body.autohide nav#siteNav:focus-within{
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 768px) {
      body.autohide nav#siteNav{
        transform: translateY(0) !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }
    }

    .hero {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #0e0e0e;
    }

    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to bottom,
          rgba(8,10,14,0.42) 0%,
          rgba(8,10,14,0.18) 20%,
          rgba(8,10,14,0.08) 42%,
          rgba(8,10,14,0.12) 75%,
          rgba(8,10,14,0.30) 100%);
    }

    main {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 7rem 1.25rem 2.5rem;
    }

    .hero-inner {
      width: min(100%, 1080px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-mark {
      width: min(88vw, 360px);
      height: auto;
      display: block;
      margin: 0 auto 1rem;
    }

    .top-rule {
      width: min(92vw, 1120px);
      height: 1px;
      margin: 0 auto 2rem;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,0.26),
        rgba(255,255,255,0)
      );
    }

    h1 {
      margin: 0;
      max-width: 22ch;
      font-weight: 400;
      font-size: clamp(2.2rem, 4vw, 4.2rem);
      line-height: 1.16;
      letter-spacing: -0.01em;
      text-wrap: balance;
      text-shadow: 0 2px 18px rgba(0,0,0,0.22);
    }

    .subline {
      margin: 1rem 0 0;
      font-size: clamp(1.05rem, 1.3vw, 1.45rem);
      line-height: 1.5;
      color: rgba(245,245,245,0.84);
      text-shadow: 0 2px 14px rgba(0,0,0,0.20);
    }

    .cta-wrap {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 290px;
      padding: 0.95rem 1.6rem;
      color: rgba(255,255,255,0.96);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(12, 22, 40, 0.74);
      box-shadow: 0 10px 28px rgba(0,0,0,0.20);
      transition: background 220ms ease, border-color 220ms ease, transform 220ms ease;
    }

    .cta-button:hover {
      background: rgba(20, 34, 60, 0.86);
      border-color: rgba(255,255,255,0.46);
      transform: translateY(-1px);
    }

    .subnav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem 1rem;
      color: rgba(245,245,245,0.66);
      font-size: 1rem;
      line-height: 1.5;
    }

    .subnav a {
      color: rgba(245,245,245,0.86);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.22);
      padding-bottom: 2px;
    }

    .subnav .dot {
      opacity: 0.6;
    }

    .proof {
      margin-top: 1rem;
      font-size: 0.94rem;
      line-height: 1.4;
      color: rgba(245,245,245,0.72);
    }

    .proof .pub {
      display: inline-block;
      margin: 0 0.35rem;
      font-weight: 600;
      color: rgba(245,245,245,0.88);
    }

    @media (max-width: 768px) {
      .hero img {
        object-position: 65% center;
      }

      h1 {
        max-width: 14ch;
        font-size: clamp(2rem, 8vw, 3rem);
      }

      .subline {
        max-width: 28ch;
        font-size: 1rem;
      }

      .cta-button {
        min-width: min(88vw, 320px);
      }
    }

    @media (max-width: 560px) {
      .subnav {
        flex-direction: column;
        gap: 0.45rem;
      }

      .subnav .dot {
        display: none;
      }
    }

<body>
  <div id="site-nav"></div>

  <div class="hero" aria-hidden="true">
    <img src="/images/home/bronco-hero-00001.jpg" alt="">
  </div>

  <main>
    <div class="hero-inner">
      <img
        class="brand-mark"
        src="/images/branding/thomas-leclair-logo-white.png"
        alt="Thomas LeClair Photography"
      >

      <div class="top-rule" aria-hidden="true"></div>

      <h1>Photography and editorial presentation for owners who want important cars represented properly.</h1>

      <p class="subline">For sale, publication, or a lasting personal record.</p>

      <div class="cta-wrap">
        <a class="cta-button" href="/commissioned.html">Request a Commission</a>

        <div class="subnav" aria-label="Secondary navigation">
          <a href="/commissioned.html">Commissioned Work</a>
          <span class="dot" aria-hidden="true">•</span>
          <a href="/editorial/">Editorial Features</a>
          <span class="dot" aria-hidden="true">•</span>
          <a href="/gallery/">Gallery</a>
        </div>

        <div class="proof" aria-label="Publication proof">
          Published in:
          <span class="pub">Hot Rod</span>
          <span class="pub">Chevy Hub</span>
          <span class="pub">Off Road Xtreme</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function includeHTML(id, url) {
      const el = document.getElementById(id);
      if (!el) return false;

      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) {
          el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
            Missing include: <strong>${url}</strong> (HTTP ${res.status})
          </div>`;
          return false;
        }
        el.innerHTML = await res.text();
        return true;
      } catch (err) {
        el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
          Failed to load include: <strong>${url}</strong>
        </div>`;
        return false;
      }
    }

    function initNavAutoHide() {
      const nav = document.getElementById("siteNav");
      if (!nav) return;

      const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (!canHover) return;

      document.body.classList.add("autohide");

      let hideTimer = null;

      const showNav = () => {
        nav.classList.add("is-visible");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      const hideSoon = () => {
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      nav.classList.remove("is-visible");

      document.addEventListener("mousemove", (e) => {
        if (e.clientY < 90) showNav();
      });

      nav.addEventListener("mouseenter", showNav);
      nav.addEventListener("mouseleave", hideSoon);
      nav.addEventListener("focusin", showNav);
      nav.addEventListener("focusout", hideSoon);
    }

    (async () => {
      const navOk = await includeHTML("site-nav", "/includes/Nav.html");
      if (navOk) initNavAutoHide();
    })();
  </script>
</body>
