<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery — Thomas LeClair Photography</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      color: #f5f5f5;
      min-height: 100vh;
    }

    /* ---------------- NAV ---------------- */

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14,14,14,0.85);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .brand img {
      height: 50px;
      opacity: 0.95;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      text-decoration: none;
      color: #f5f5f5;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    nav a:hover { opacity: 1; }

    /* ---------------- MAIN ---------------- */

    main {
      padding-top: 8rem;
      max-width: 1100px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 3rem;
      text-align: center;
    }

    /* ---------------- GALLERY CARDS ---------------- */

    .gallery-section {
      margin-bottom: 4rem;
    }

    .gallery-card {
      position: relative;
      display: block;
      padding: 3rem;
      border: 1px solid rgba(255,255,255,0.15);
      color: #f5f5f5;
      text-decoration: none;
      overflow: hidden;
    }

    .gallery-card h2 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-weight: 400;
      letter-spacing: 0.05em;
    }

    .gallery-card .cta {
      position: relative;
      z-index: 2;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      opacity: 0.75;
    }

    /* background image */
    .gallery-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--bg);
      background-size: cover;
      background-position: center;
      opacity: 0.15;
      filter: blur(4px);
      transition: opacity 0.6s ease, filter 0.6s ease;
    }

    /* dark overlay */
    .gallery-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(14,14,14,0.55);
      z-index: 1;
    }

    /* hover reveal (desktop only) */
    @media (hover: hover) {
      .gallery-card:hover::before {
        opacity: 0.45;
        filter: blur(2px);
      }
    }

    /* ---------------- FOOTER ---------------- */

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.8rem;
      color: #b8b8b8;
    }

    footer a {
      color: #b8b8b8;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover { color: #e0e0e0; }

  </style>
</head>

<body>

  <nav>
    <div class="brand">
      <a href="/">
        <img src="/images/Signature-TuesdayNight_Font+photography_250.png"
             alt="Thomas LeClair Photography">
      </a>
    </div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gallery/">Gallery</a></li>
      <li><a href="/editorial/">Editorial</a></li>
      <li><a href="/about.html">About</a></li>
      <li><a href="/prints.html">Prints</a></li>
      <li><a href="/contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <h1>Gallery</h1>

    <section class="gallery-section">
      <a class="gallery-card" href="/gallery/wildlife.html"
         style="--bg:url('/images/gallery/wildlife/20190901DSR-2019-IMG_0584.webp');"
         aria-label="View Wildlife gallery">
        <h2>Wildlife</h2>
        <div class="cta">View gallery →</div>
      </a>
    </section>

    <section class="gallery-section">
      <a class="gallery-card" href="/gallery/automotive.html"
         style="--bg:url('/images/gallery/Automotive/20190115lamborghini-champagne-IMG_7444.webp');"
         aria-label="View Automotive gallery">
        <h2>Automotive</h2>
        <div class="cta">View gallery →</div>
      </a>
    </section>

    <section class="gallery-section">
      <a class="gallery-card" href="/gallery/landscape.html"
         style="--bg:url('/images/gallery/landscape/Canyonlands-31.webp');"
         aria-label="View Landscape gallery">
        <h2>Landscape</h2>
        <div class="cta">View gallery →</div>
      </a>
    </section>

    <section class="gallery-section">
      <a class="gallery-card" href="/gallery/studies.html"
         style="--bg:url('/images/gallery/studies/20190115lamborghini-champagne-IMG_7485.webp');"
         aria-label="View Studies gallery">
        <h2>Studies</h2>
        <div class="cta">View gallery →</div>
      </a>
    </section>

  </main>

  <footer>
    <a href="https://www.instagram.com/tlp_motoring_photography/" target="_blank">
      Instagram — Motoring
    </a>
    <span>·</span>
    <a href="https://www.instagram.com/tlp_outdoor_photography/" target="_blank">
      Instagram — Outdoor
    </a>
  </footer>

</body>
</html>
