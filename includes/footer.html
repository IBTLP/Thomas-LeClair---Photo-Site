<style>

  }

  .site-footer{

    text-align: center;
    font-size: .82rem;
    color: var(--footer-text);

    /* gradient hairline across top of footer (matches nav concept) */
    border-top: 1px solid transparent;

      90deg,
      rgba(255,255,255,0),
      var(--footer-hair),
      rgba(255,255,255,0)
    ) 1;
  }

  .site-footer .footer-inner{
    width: min(1040px, calc(100% - 84px));
    margin: 0 auto;
    display: grid;
    gap: 0;                 /* we’ll control spacing per row */
    justify-items: center;
  }

  .footer-row{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: .35rem;
    line-height: 1.7;
  }

  .site-footer a{
    color: var(--footer-text);
    text-decoration: none;
    opacity: .95;
    position: relative;
    padding: .15rem 0;      /* gives room for underline */
    transition: opacity 160ms ease, color 160ms ease;
  }

  .site-footer a:hover{
    opacity: 1;
    color: var(--footer-text-strong);
  }

  /* underline hairline on hover (like nav) */
  .site-footer a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-6px;
    width:100%;
    height:1px;
    background: rgba(245,245,245,.38);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 260ms ease, background 260ms ease;
  }

  @media (hover:hover){
    .site-footer a:hover::after{
      transform: scaleX(1);
      background: rgba(245,245,245,.60);
    }
  }

  .site-footer .dot{
    opacity: .45;
    margin: 0 .35rem;
  }

  .footer-meta{
    margin-top: .8rem;      /* “another line” of air */
    opacity: .55;
    letter-spacing: .02em;
  }

      width: calc(100% - 32px);
