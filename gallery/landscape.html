<head>

  <meta charset="UTF-8" />

  <title>Landscape Photography — Thomas LeClair</title>

  <meta name="description" content="Landscape photography by Thomas LeClair—light-driven scenes from the American West, including a photograph made with 120+ year-old vintage glass." />
  <link rel="canonical" href="https://tleclair.com/gallery/landscape/" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="Landscape Photography — Thomas LeClair" />
  <meta property="og:description" content="Light-driven landscapes from the American West, including a photograph made with 120+ year-old vintage glass." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tleclair.com/gallery/landscape/" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Landscape Photography — Thomas LeClair" />
  <meta name="twitter:description" content="Light-driven landscapes from the American West, including an image made with 120+ year-old vintage glass." />
  <meta name="twitter:image" content="https://tleclair.com/images/gallery/landscape/Canyonlands-31.webp" />

  <style>
    * { box-sizing: border-box; }

    :root{
      /* ✅ nav clearance dial */
      --nav-pad: 8.25rem; /* default */
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      color: #f5f5f5;
      min-height: 100vh;
    }

    /* ================= NAV (MATCH CONTACT / HOME) ================= */
    nav#siteNav{
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(14,14,14,.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition: transform 1.25s ease, opacity 1.55s ease;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;

      /* gradient hairline */
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.10),
        rgba(255,255,255,0)
      ) 1;
    }

    /* auto-hide behavior (desktop only, JS adds body.autohide) */
    body.autohide nav#siteNav{
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
    }
    body.autohide nav#siteNav.is-visible,
    body.autohide nav#siteNav:hover,
    body.autohide nav#siteNav:focus-within{
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* force visible on touch devices */
    @media (max-width: 768px) {
      body.autohide nav#siteNav{
        transform: translateY(0) !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }
    }

    /* ✅ padding under fixed nav (safe-area aware) */
    main{
      padding-top: calc(var(--nav-pad) + env(safe-area-inset-top));
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    /* iPhone/nav wrap: give more headroom */
    @media (max-width: 640px){
      :root{ --nav-pad: 9.75rem; }
      main{ padding-left: 1.25rem; padding-right: 1.25rem; }
    }

    h1 {
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 3.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    /* === MATCH AUTOMOTIVE GALLERY BEHAVIOR === */
    .gallery-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      transition: opacity 0.2s ease;
      cursor: zoom-in;
    }

    .gallery-grid img:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      font-size: 0.8rem;
      color: #b8b8b8;
    }

    footer a {
      color: #b8b8b8;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      color: #e0e0e0;
    }

    /* === GLOBAL LIGHTBOX (same as Automotive) === */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(14,14,14,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
      pointer-events: none;
    }

    .lightbox[style*="display: flex"] {
      pointer-events: auto;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
    }

    /* === ADDITIONS (NO STYLE CHANGES TO EXISTING RULES) === */
    .page-head { margin-bottom: 2rem; }
    .subtitle {
      max-width: 820px;
      margin: -2.5rem auto 0;
      text-align: center;
      color: rgba(245,245,245,0.72);
      font-weight: 300;
      line-height: 1.6;
    }

    .section-title{
      margin: 2.25rem 0 1rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      font-size: 1rem;
      color: rgba(245,245,245,0.75);
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- GLOBAL NAV INCLUDE (matches Contact/Home) -->
  <div id="site-nav"></div>

  <main>
    <header class="page-head">
      <h1>Landscape Photography</h1>
      <p class="subtitle">
        Landscapes where light does the heavy lifting—quiet moments, big space, and weather.
        One image in this set was made with vintage glass over 120 years old.
      </p>
    </header>

    <h2 class="section-title">Selected Work</h2>

    <section class="gallery-grid" aria-label="Landscape photo gallery">
      <img src="/images/gallery/landscape/20190604GardenoftheGods-IMG_4471webp.webp"
           alt="Garden of the Gods landscape photograph"
           loading="lazy" decoding="async">

      <img src="/images/gallery/landscape/Canyonlands-31.webp"
           alt="Canyonlands landscape photograph"
           loading="lazy" decoding="async">

      <img src="/images/gallery/landscape/VacationJune-315webp.webp"
           alt="Landscape photograph from the American West"
           loading="lazy" decoding="async">

      <img src="/images/gallery/landscape/ToadstoolTrailHead-55812018.webp"
           alt="Toadstool Trailhead landscape photograph"
           loading="lazy" decoding="async">

      <img src="/images/gallery/landscape/round21.webp"
           alt="Deer Springs Ranch landscape photograph"
           loading="lazy" decoding="async">

      <img src="/images/gallery/landscape/round211.webp"
           alt="Deer Springs Ranch landscape photograph, second view"
           loading="lazy" decoding="async">
    </section>
  </main>

  <footer>
    <a href="https://www.instagram.com/tlp_motoring_photography/" target="_blank" rel="noopener noreferrer">
      Instagram — Motoring
    </a>
    ·
    <a href="https://www.instagram.com/tlp_outdoor_photography/" target="_blank" rel="noopener noreferrer">
      Instagram — Outdoor
    </a>
  </footer>

  <!-- GLOBAL LIGHTBOX -->
  <div class="lightbox" id="global-lightbox" aria-hidden="true">
    <img id="global-lightbox-img" alt="">
  </div>

  <script src="/js/lightbox.js" defer></script>

  <script>
    async function includeHTML(id, url) {
      const el = document.getElementById(id);
      if (!el) return false;

      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) {
          el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
            Missing include: <strong>${url}</strong> (HTTP ${res.status})
          </div>`;
          return false;
        }
        el.innerHTML = await res.text();
        return true;
      } catch (err) {
        el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
          Failed to load include: <strong>${url}</strong>
        </div>`;
        return false;
      }
    }

    function initNavAutoHide() {
      const nav = document.getElementById("siteNav");
      if (!nav) return;

      const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (!canHover) return; // don’t hide on touch devices

      document.body.classList.add("autohide");

      let hideTimer = null;

      const showNav = () => {
        nav.classList.add("is-visible");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      const hideSoon = () => {
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      nav.classList.remove("is-visible");

      document.addEventListener("mousemove", (e) => {
        if (e.clientY < 90) showNav();
      });

      nav.addEventListener("mouseenter", showNav);
      nav.addEventListener("mouseleave", hideSoon);
      nav.addEventListener("focusin", showNav);
      nav.addEventListener("focusout", hideSoon);
    }

    (async () => {
      const navOk = await includeHTML("site-nav", "/includes/Nav.html");
      if (navOk) initNavAutoHide();
    })();
  </script>
</body>
</html>
