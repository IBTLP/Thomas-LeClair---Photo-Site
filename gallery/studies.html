<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Studies — Thomas LeClair Photography</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      color: #f5f5f5;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14,14,14,0.85);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .brand img {
      height: 50px;
      width: auto;
      display: block;
      opacity: 0.95;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      text-decoration: none;
      color: #f5f5f5;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    nav a:hover { opacity: 1; }

    main {
      padding-top: 8rem;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    h1 {
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 0.75rem;
    }

    .page-note {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(245,245,245,0.65);
      margin-bottom: 3rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .gallery-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      transition: opacity 0.2s ease;
    }

    .gallery-grid a:hover img { opacity: 0.9; }

    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      font-size: 0.8rem;
      color: #b8b8b8;
    }

    footer a {
      color: #b8b8b8;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover { color: #e0e0e0; }
  </style>
</head>

<body>
  <nav>
    <div class="brand">
      <a href="/">
        <img src="/images/Signature-TuesdayNight_Font+photography_250.png" alt="Thomas LeClair Photography">
      </a>
    </div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/gallery/">Gallery</a></li>
      <li><a href="/editorial/">Editorial</a></li>
      <li><a href="/about.html">About</a></li>
      <li><a href="/prints.html">Prints</a></li>
      <li><a href="/contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <h1>Studies</h1>
    <div class="page-note">
      Moments and experiments outside my primary galleries.
    </div>

    <section class="gallery-grid">
      <a href="/images/gallery/studies/studies-01.webp" target="_blank">
        <img src="/images/gallery/studies/studies-01.webp" alt="">
      </a>
      <a href="/images/gallery/studies/studies-02.webp" target="_blank">
        <img src="/images/gallery/studies/studies-02.webp" alt="">
      </a>
      <a href="/images/gallery/studies/studies-03.webp" target="_blank">
        <img src="/images/gallery/studies/studies-03.webp" alt="">
      </a>
      <a href="/images/gallery/studies/studies-04.webp" target="_blank">
        <img src="/images/gallery/studies/studies-04.webp" alt="">
      </a>
    </section>
  </main>

  <footer>
    <a href="https://www.instagram.com/tlp_motoring_photography/" target="_blank">
      Instagram — Motoring
    </a>
    <span>·</span>
    <a href="https://www.instagram.com/tlp_outdoor_photography/" target="_blank">
      Instagram — Outdoor
    </a>
  </footer>
</body>
</html>
