<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wildlife — Thomas LeClair Photography</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      color: #f5f5f5;
      min-height: 100vh;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 14, 14, 0.85);
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .brand img {
      height: 50px;
      width: auto;
      display: block;
      opacity: 0.95;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      margin: 0;
      padding: 0;
    }

    nav a {
      text-decoration: none;
      color: #f5f5f5;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    nav a:hover {
      opacity: 1;
    }

    main {
      padding-top: 9.5rem;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    h1 {
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 3.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    /* === MATCH AUTOMOTIVE / LANDSCAPE === */

    .gallery-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      transition: opacity 0.2s ease;
      cursor: zoom-in;
    }

    .gallery-grid img:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      font-size: 0.8rem;
      color: #b8b8b8;
    }

    footer a {
      color: #b8b8b8;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      color: #e0e0e0;
    }

    /* === GLOBAL LIGHTBOX (shared) === */

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(14,14,14,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
      pointer-events: none;
    }

    .lightbox[style*="display: flex"] {
      pointer-events: auto;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
    }
  </style>
</head>

<body>
<nav>
  <div class="brand">
    <a href="/">
      <img src="/images/Signature-TuesdayNight_Font+photography_250.png" alt="Thomas LeClair Photography">
    </a>
  </div>
  <ul>
    <li><a href="/">Home</a></li>
    <li><a href="/gallery/">Gallery</a></li>
    <li><a href="/editorial/">Editorial</a></li>
    <li><a href="/about.html">About</a></li>
    <li><a href="/prints.html">Prints</a></li>
    <li><a href="/contact.html">Contact</a></li>
  </ul>
</nav>

<main>
  <h1>Wildlife</h1>

  <section class="gallery-grid">
    <!-- Replace / expand with your actual wildlife images -->
  <img src="/images/gallery/wildlife/0190503Bolsa-Chica-IMG_0579.webp" alt="Bolsa Chica wetlands wildlife">
  <img src="/images/gallery/wildlife/round25.webp" alt="Deer Springs Ranch wildlife">
  <img src="/images/gallery/wildlife/20120408SoCalCoast-170.webp" alt="Southern California coast wildlife">
  <img src="/images/gallery/wildlife/20181106Bolsa-Chica-IMG_3989.webp" alt="Bolsa Chica wildlife">
  <img src="/images/gallery/wildlife/20190901DSR-2019-IMG_0584.webp" alt="Deer Springs Ranch wildlife">
  <img src="/images/gallery/wildlife/RanchSpring2018.webp" alt="Spring wildlife at the ranch">
  <img src="/images/gallery/wildlife/Zion-389.webp" alt="Zion National Park wildlife">
  <img src="/images/gallery/wildlife/round27.webp" alt="Deer Springs Ranch wildlife">
  <img src="/images/gallery/wildlife/round44.webp" alt="BOLSA CHICA">

  </section>
</main>

<footer>
  <a href="https://www.instagram.com/tlp_motoring_photography/" target="_blank">
    Instagram — Motoring
  </a>
  ·
  <a href="https://www.instagram.com/tlp_outdoor_photography/" target="_blank">

  </a>
</footer>

<!-- GLOBAL LIGHTBOX -->
<div class="lightbox" id="global-lightbox" aria-hidden="true">
  <img id="global-lightbox-img" alt="">
</div>

<script src="/js/lightbox.js" defer></script>

</body>
</html>
