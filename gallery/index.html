<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery — Thomas LeClair Photography</title>

  <meta name="description" content="Curated selections across automotive, landscape, wildlife, and studies by Thomas LeClair." />
  <link rel="canonical" href="https://www.tleclair.com/gallery/" />

  <!-- Open Graph / Social -->
  <meta property="og:title" content="Gallery — Thomas LeClair Photography" />
  <meta property="og:description" content="Curated selections across automotive, landscape, wildlife, and studies." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.tleclair.com/gallery/" />
  <meta property="og:image" content="https://www.tleclair.com/images/home-auto.webp" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Gallery — Thomas LeClair Photography" />
  <meta name="twitter:description" content="Curated selections across automotive, landscape, wildlife, and studies." />
  <meta name="twitter:image" content="https://www.tleclair.com/images/home-auto.webp" />

  <style>
    * { box-sizing: border-box; }

    :root{
      --bg:#0e0e0e;
      --text:#f5f5f5;

      /* Single dial for card width (wider on desktop) */
      --card-max: clamp(720px, 52vw, 1300px);
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;

      /* Prints-page footer behavior on short pages */
      display: flex;
      flex-direction: column;
    }

    main { flex: 1 0 auto; }

    /* ================= NAV (EXACTLY LIKE PRINTS) ================= */
    /* Nav is injected by /includes/Nav.html and should contain: <nav id="siteNav"> ... </nav> */
    nav#siteNav{
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(14,14,14,.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition: transform 1.25s ease, opacity 1.55s ease;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;

      /* gradient hairline */
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.10),
        rgba(255,255,255,0)
      ) 1;
    }

    /* auto-hide behavior (desktop only, JS adds body.autohide) */
    body.autohide nav#siteNav{
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
    }
    body.autohide nav#siteNav.is-visible,
    body.autohide nav#siteNav:hover,
    body.autohide nav#siteNav:focus-within{
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* force visible on touch devices */
    @media (max-width: 768px) {
      body.autohide nav#siteNav{
        transform: translateY(0) !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }
    }

    /* ================= MAIN (KEEP YOUR ORIGINAL GALLERY GEOMETRY) ================= */
    main {
      padding-top: 8rem;
      max-width: 1900px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 0.06em;
      margin: 0 0 0.75rem 0;
    }

    .subhead {
      margin: 0 auto;
      max-width: 56ch;
      font-size: 0.95rem;
      line-height: 1.5;
      color: rgba(245,245,245,0.72);
    }

    /* ================= GALLERY CARDS ================= */

    .gallery-grid {
      display: grid;
      gap: 1.25rem;
      margin-bottom: 4rem;

      /* prevent cards from stretching full-width when main gets wider */
      justify-items: center;
    }

    .gallery-card {
      position: relative;
      display: block;

      width: 100%;
      max-width: var(--card-max);

      padding: 3.25rem 3rem;
      border: 1px solid rgba(255,255,255,0.14);
      color: #f5f5f5;
      text-decoration: none;
      overflow: hidden;
      border-radius: 2px;
      transform: translateZ(0);
    }

    .gallery-card h2 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-weight: 400;
      letter-spacing: 0.06em;
      font-size: 1.15rem;
    }

    .gallery-card .cta {
      position: relative;
      z-index: 2;
      margin-top: 0.9rem;
      font-size: 0.85rem;
      opacity: 0.75;
    }

    .gallery-card:focus-visible {
      outline: 2px solid rgba(245,245,245,0.55);
      outline-offset: 3px;
    }

    /* background image layer */
    .gallery-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--bg);
      background-size: cover;
      background-position: center;

      /* base look */
      opacity: 0.24;
      filter: blur(4px);
      transform: scale(1.03);

      transition: opacity 0.6s ease, filter 0.6s ease, transform 0.8s ease;
    }

    /* dark overlay + AFTER-BLUR (minimized) */
    .gallery-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(14,14,14,0.58);
      z-index: 1;

      /* minimal after-blur */
      backdrop-filter: blur(0.5px);
      -webkit-backdrop-filter: blur(0.5px);
    }

    /* hover reveal (desktop only) */
    @media (hover: hover) {
      .gallery-card:hover::before {
        opacity: 0.82;
        filter: blur(0.5px);
        transform: scale(1.06);
      }

      /* keep Safari/Chrome consistent */
      .gallery-card:hover::after {
        backdrop-filter: blur(0.5px);
        -webkit-backdrop-filter: blur(0.5px);
      }
    }

    /* responsive spacing */
    @media (max-width: 1100px) {
      main { padding-left: 1.25rem; padding-right: 1.25rem; }
      .gallery-card { padding: 2.5rem 1.75rem; }
      :root{ --card-max: 1900px; } /* keep full width on smaller screens */
    }

    /* ================= INCLUDED FOOTER (EXACTLY LIKE PRINTS) ================= */
    /* /includes/footer.html should contain: <footer class="site-footer"> ... </footer> */
    .site-footer{
      border-top: 1px solid transparent;
      border-image: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.10),
        rgba(255,255,255,0)
      ) 1;

      padding: 2rem 1rem;
      font-size: 0.8rem;
      color: #b8b8b8;
      text-align: center;
    }

    .site-footer a{
      color: #b8b8b8;
      text-decoration: none;
      margin: 0 0.5rem;
    }
    .site-footer a:hover{ color:#e0e0e0; }

    @media (max-width: 640px){
      main{ padding-top: 9.25rem; } /* if nav wraps on small screens */
    }
  </style>
</head>

<body>
  <!-- GLOBAL NAV INCLUDE (MATCH PRINTS) -->
  <div id="site-nav"></div>

  <main>
    <header>
      <h1>Gallery</h1>
      <p class="subhead">
        Curated selections across automotive, landscape, wildlife, and studies.
      </p>
    </header>

    <section class="gallery-grid">

      <a class="gallery-card" href="/gallery/automotive.html"
         style="--bg:url('/images/gallery/Automotive/20190115lamborghini-champagne-IMG_7444.webp');"
         aria-label="View Automotive gallery">
        <h2>Automotive</h2>
        <div class="cta">View gallery →</div>
      </a>

      <a class="gallery-card" href="/gallery/landscape.html"
         style="--bg:url('/images/gallery/landscape/Canyonlands-31.webp');"
         aria-label="View Landscape gallery">
        <h2>Landscape</h2>
        <div class="cta">View gallery →</div>
      </a>

      <a class="gallery-card" href="/gallery/wildlife.html"
         style="--bg:url('/images/gallery/wildlife/20190901DSR-2019-IMG_0584.webp');"
         aria-label="View Wildlife gallery">
        <h2>Wildlife</h2>
        <div class="cta">View gallery →</div>
      </a>

      <a class="gallery-card" href="/gallery/studies.html"
         style="--bg:url('/images/gallery/studies/20190115lamborghini-champagne-IMG_7485.webp');"
         aria-label="View Studies gallery">
        <h2>Studies</h2>
        <div class="cta">View gallery →</div>
      </a>

    </section>
  </main>

  <!-- GLOBAL FOOTER INCLUDE (MATCH PRINTS) -->
  <div id="site-footer"></div>

  <script>
    async function includeHTML(id, url) {
      const el = document.getElementById(id);
      if (!el) return false;

      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) {
          el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
            Missing include: <strong>${url}</strong> (HTTP ${res.status})
          </div>`;
          return false;
        }
        el.innerHTML = await res.text();
        return true;
      } catch (err) {
        el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
          Failed to load include: <strong>${url}</strong>
        </div>`;
        return false;
      }
    }

    function initNavAutoHide() {
      const nav = document.getElementById("siteNav");
      if (!nav) return;

      const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (!canHover) return; // don’t hide on touch devices

      document.body.classList.add("autohide");

      let hideTimer = null;

      const showNav = () => {
        nav.classList.add("is-visible");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      const hideSoon = () => {
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      // Start hidden (same as Prints)
      nav.classList.remove("is-visible");

      document.addEventListener("mousemove", (e) => {
        if (e.clientY < 90) showNav();
      });

      nav.addEventListener("mouseenter", showNav);
      nav.addEventListener("mouseleave", hideSoon);
      nav.addEventListener("focusin", showNav);
      nav.addEventListener("focusout", hideSoon);
    }

    (async () => {
      const navOk = await includeHTML("site-nav", "/includes/Nav.html");
      const footOk = await includeHTML("site-footer", "/includes/footer.html");

      if (navOk) initNavAutoHide();
      if (!footOk) console.warn("footer include failed. Check exact path/case: /includes/footer.html");
    })();
  </script>
</body>
</html>
