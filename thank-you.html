<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GYPE7JD4H9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GYPE7JD4H9');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You — Thomas LeClair Photography</title>

  <style>
    * { box-sizing: border-box; }

    :root{
      --bg:#0e0e0e;
      --text:#f5f5f5;
      --muted:rgba(245,245,245,.72);
      --line:rgba(255,255,255,.10);
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ================= INCLUDED NAV (GLOBAL) ================= */
    nav#siteNav{
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(8,8,8,.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 1.15rem 0;

      /* gradient hairline */
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.10),
        rgba(255,255,255,0)
      ) 1;
    }

    nav#siteNav .nav-inner{
      width: min(1120px, calc(100% - 64px));
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    nav#siteNav .brand img{
      height: 44px;
      opacity: .92;
      width: auto;
      display: block;
    }

    nav#siteNav ul{
      list-style: none;
      display: flex;
      gap: 1.25rem;
      margin: 0;
      padding: 0;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav#siteNav a{
      text-decoration: none;
      color: var(--text);
      font-size: 0.9rem;
      opacity: 0.82;
      letter-spacing: .02em;
      position: relative;
      padding: .35rem 0;
      line-height: 1;
      transition: opacity 160ms ease;
    }

    nav#siteNav a:hover{ opacity: 1; }

    /* underline hover (shared, premium) */
    nav#siteNav a::after{
      content:"";
      position:absolute;
      left:0; bottom:-6px;
      width:100%;
      height:1px;
      background: rgba(245,245,245,.38);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 220ms ease;
    }
    @media (hover:hover){
      nav#siteNav a:hover::after{ transform: scaleX(1); }
    }

    /* subtle “primary” emphasis for Commissions */
    nav#siteNav a.nav-primary{
      opacity: .95;
    }
    nav#siteNav a.nav-primary::after{
      background: rgba(245,245,245,.55);
      transform: scaleX(.35);
    }
    @media (hover:hover){
      nav#siteNav a.nav-primary:hover::after{ transform: scaleX(1); }
    }

    @media (max-width: 640px){
      nav#siteNav .nav-inner{
        width: calc(100% - 28px);
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      nav#siteNav ul{
        justify-content: center;
        gap: 1.0rem;
      }
    }

    /* ================= PAGE CONTENT ================= */
    main {
      padding-top: 10.5rem; /* leaves room for fixed nav */
      max-width: 700px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
      text-align: center;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
    }

    p {
      opacity: 0.75;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    a.btn {
      display: inline-block;
      padding: 0.9rem 1.25rem;
      background: #f5f5f5;
      color: #0e0e0e;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      opacity: 1;
    }
    a.btn:hover { opacity: 0.9; }

    /* ================= INCLUDED FOOTER (GLOBAL) ================= */
    .site-footer{
      margin-top: 3.25rem;
      border-top: 1px solid rgba(255,255,255,.06);
      padding: 2.25rem 0 2rem;
      color: rgba(245,245,245,.62);
      text-align: center;
      font-size: .82rem;
    }

    .site-footer .footer-inner{
      width: min(1120px, calc(100% - 64px));
      margin: 0 auto;
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    .site-footer a{
      color: rgba(245,245,245,.62);
      text-decoration: none;
      margin: 0 .5rem;
      opacity: .95;
    }
    .site-footer a:hover{ color: rgba(245,245,245,.88); }

    .site-footer .dot{ opacity: .5; margin: 0 .25rem; }

    .site-footer .footer-meta{
      opacity: .6;
      letter-spacing: .02em;
    }

    @media (max-width: 640px){
      .site-footer .footer-inner{
        width: calc(100% - 28px);
      }
      main{
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }
    }
  </style>
</head>

<body>
  <!-- GLOBAL NAV INCLUDE -->
  <div id="site-nav"></div>

  <main>
    <h1>Thank you.</h1>
    <p>Your message has been sent. I’ll reply as soon as I can.</p>
    <a class="btn" href="/">BACK TO HOME</a>
  </main>

  <!-- GLOBAL FOOTER INCLUDE -->
  <div id="site-footer"></div>

  <!-- Include loader -->
  <script>
    async function includeHTML(id, url) {
      const el = document.getElementById(id);
      if (!el) return;
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) return;
      el.innerHTML = await res.text();
    }

    includeHTML("site-nav", "/includes/Nav.html");
    includeHTML("site-footer", "/includes/footer.html");
  </script>
</body>
</html>
