  <style>
    * { box-sizing: border-box; }

    :root{
      /* ✅ nav clearance dial */
      --nav-pad: 8.25rem; /* default */
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0e0e0e;
      color: #f5f5f5;
      min-height: 100vh;
    }

    /* ================= NAV (MATCH CONTACT / HOME) ================= */
    nav#siteNav{
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(14,14,14,.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition: transform 1.25s ease, opacity 1.55s ease;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;

      /* gradient hairline */
      border-bottom: 1px solid transparent;
      border-image: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.10),
        rgba(255,255,255,0)
      ) 1;
    }

    /* auto-hide behavior (desktop only, JS adds body.autohide) */
    body.autohide nav#siteNav{
      transform: translateY(-110%);
      opacity: 0;
      pointer-events: none;
    }
    body.autohide nav#siteNav.is-visible,
    body.autohide nav#siteNav:hover,
    body.autohide nav#siteNav:focus-within{
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* force visible on touch devices */
    @media (max-width: 768px) {
      body.autohide nav#siteNav{
        transform: translateY(0) !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }
    }

    /* ✅ padding under fixed nav (safe-area aware) */
    main {
      padding-top: calc(var(--nav-pad) + env(safe-area-inset-top));
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    /* iPhone/nav wrap: give more headroom */
    @media (max-width: 640px){
      :root{ --nav-pad: 9.75rem; }
      main{ padding-left: 1.25rem; padding-right: 1.25rem; }
    }

    /* ✅ ensure anchor jumps don’t hide headings under the nav */
    :where(h1,h2,h3,h4,h5,h6,[id]){
      scroll-margin-top: calc(var(--nav-pad) + 18px);
    }

    /* === PAGE TYPO / LAYOUT (UNCHANGED CONTENT STYLES) === */
    h1 {
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 3.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.75rem;
    }

    .gallery-grid img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 2px;
      transition: opacity 0.2s ease;
      cursor: zoom-in;
    }

    .gallery-grid img:hover { opacity: 0.85; }

    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      font-size: 0.8rem;
      color: #b8b8b8;
    }

    footer a {
      color: #b8b8b8;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover { color: #e0e0e0; }

    /* === GLOBAL LIGHTBOX (shared) === */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(14,14,14,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
      pointer-events: none;
    }

    .lightbox[style*="display: flex"] { pointer-events: auto; }

    .lightbox img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
    }

    /* === ADDITIONS (NO STYLE CHANGES TO EXISTING RULES) === */
    .page-head { margin-bottom: 2rem; }
    .subtitle {
      max-width: 820px;
      margin: 0.25rem auto 0;
      text-align: center;
      color: rgba(245,245,245,0.72);
      font-weight: 300;
      line-height: 1.6;
    }

    .section-title{
      margin: 2.25rem 0 1rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      font-size: 1rem;
      color: rgba(245,245,245,0.75);
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>

<body>

  <script>
    async function includeHTML(id, url) {
      const el = document.getElementById(id);
      if (!el) return false;

      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) {
          el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
            Missing include: <strong>${url}</strong> (HTTP ${res.status})
          </div>`;
          return false;
        }
        el.innerHTML = await res.text();
        return true;
      } catch (err) {
        el.innerHTML = `<div style="padding:18px; text-align:center; opacity:.7; font-size:.85rem;">
          Failed to load include: <strong>${url}</strong>
        </div>`;
        return false;
      }
    }

    function initNavAutoHide() {
      const nav = document.getElementById("siteNav");
      if (!nav) return;

      const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (!canHover) return; // don’t hide on touch devices

      document.body.classList.add("autohide");

      let hideTimer = null;

      const showNav = () => {
        nav.classList.add("is-visible");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      const hideSoon = () => {
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!nav.matches(":hover") && !nav.matches(":focus-within")) {
            nav.classList.remove("is-visible");
          }
        }, 900);
      };

      nav.classList.remove("is-visible");

      document.addEventListener("mousemove", (e) => {
        if (e.clientY < 90) showNav();
      });

      nav.addEventListener("mouseenter", showNav);
      nav.addEventListener("mouseleave", hideSoon);
      nav.addEventListener("focusin", showNav);
      nav.addEventListener("focusout", hideSoon);
    }

    (async () => {
      const navOk = await includeHTML("site-nav", "/includes/Nav.html");
      if (navOk) initNavAutoHide();
    })();
  </script>
</body>
